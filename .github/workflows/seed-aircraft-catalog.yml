name: Run aircraft catalog seed

on:
  workflow_dispatch:

jobs:
  seed-aircraft-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run aircraft catalog seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run seed:aircraft
